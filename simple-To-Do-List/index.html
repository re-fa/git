<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>To Do List</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="divShowBTN">
    <button class="showWindowBTN main-btn" id="showWindowBTN">New Task</button>
  </div>
  <div class="overly" id="windowInfoTask">
    <div class="infoTask">
      <input type="text" id="taskTitle" placeholder="Task Title" class="taskName">
      <button id="addTask" class="main-btn">Add This Task</button>
      <button id="cancelTask" class="main-btn">Cancel</button>
    </div>
  </div>
  <div class="container" id="containerTasks"><p id="count">No Tasks</p>
  </div>
  <script src="master.js"></script>
</body>
</html>
